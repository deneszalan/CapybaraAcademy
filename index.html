<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapybaří akademie dějepisu 🦫📜</title>
    <meta name="description" content="Dějepis pro 6. třídu krok za krokem: historické prameny, čas a období dějin, vznik člověka. Česky i anglicky.">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --bg: #fdf6ec;
            --surface: #fff8ef;
            --surface2: #f0e0c8;
            --paper: #ffffff;
            --accent: #8b5e3c;
            --accent2: #c68642;
            --green: #6a9f4d;
            --orange: #e8943a;
            --red: #d45b5b;
            --blue: #5da8c4;
            --purple: #9b7cb9;
            --text: #4a3728;
            --muted: #9c8672;
            --water: #7ec8d9;
            --water-light: #d4f0f6;
            /* source types / periods */
            --c-w: #4f97b3;   /* written  – ink blue   */
            --c-m: #c47a2c;   /* material – clay       */
            --c-p: #8e6bb0;   /* pictorial – paint     */
            --p-pre: #c68642; /* pravěk   */
            --p-anc: #6a9f4d; /* starověk */
            --p-mid: #5da8c4; /* středověk */
            --p-mod: #9b7cb9; /* novověk  */
            --mono: 'Fira Mono', ui-monospace, monospace;
            --sans: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body {
            font-family: var(--sans);
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 10% 90%, rgba(126,200,217,.15) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 20%, rgba(198,134,66,.1) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }
        .header { text-align: center; margin-bottom: 1rem; display: flex; flex-direction: column; align-items: center; }
        .header .capy-icon { font-size: 3rem; margin-bottom: .25rem; display: block; }
        h1 { font-size: 2rem; font-weight: 800; color: var(--accent); margin-bottom: .25rem; text-wrap: balance; }
        .subtitle { color: var(--muted); margin-bottom: .6rem; font-size: .95rem; font-weight: 600; }

        /* ── Language switch ───────────────────────── */
        .lang-switch {
            display: inline-flex;
            background: var(--surface2);
            border-radius: .65rem;
            padding: .25rem;
            gap: .25rem;
            margin-bottom: .5rem;
        }
        .lang-switch button {
            background: transparent;
            color: var(--muted);
            padding: .4rem .9rem;
            font-size: .85rem;
        }
        .lang-switch button .code {
            font-family: var(--mono);
            font-size: .72rem;
            background: var(--surface);
            border-radius: .3rem;
            padding: .05rem .3rem;
            margin-right: .35rem;
        }
        .lang-switch button.active { background: var(--paper); color: var(--accent); box-shadow: 0 2px 8px rgba(139,94,60,.12); }
        .legend { font-size: .8rem; color: var(--muted); font-weight: 600; }
        .legend b { color: var(--red); }

        /* ── Tabs ───────────────────────────────────── */
        .tabs {
            display: grid;
            grid-template-columns: repeat(4, auto);
            gap: .5rem;
            background: var(--surface);
            border: 2px solid var(--surface2);
            border-radius: 1rem;
            padding: .35rem;
            margin-bottom: 1.75rem;
            box-shadow: 0 4px 16px rgba(139,94,60,.06);
        }
        .tab-btn {
            font-family: var(--sans);
            font-weight: 700;
            font-size: .95rem;
            padding: .65rem 1.2rem;
            border: none;
            border-radius: .65rem;
            cursor: pointer;
            background: transparent;
            color: var(--muted);
            transition: all .2s;
        }
        .tab-btn:hover { color: var(--accent); }
        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 2px 12px rgba(139,94,60,.25);
        }
        .tab-panel { display: none; width: 100%; flex-direction: column; align-items: center; }
        .tab-panel.active { display: flex; }

        /* ── Controls ───────────────────────────────── */
        .controls {
            background: var(--surface);
            border: 2px solid var(--surface2);
            border-radius: 1.25rem;
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            align-items: center;
            margin-bottom: 2rem;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(139,94,60,.08);
        }
        .control-group { display: flex; flex-direction: column; gap: .35rem; min-width: 0; width: 100%; max-width: 520px; }
        .control-group label {
            font-size: .75rem;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--muted);
            font-weight: 700;
        }
        .control-group select {
            width: 100%;
            padding: .55rem .75rem;
            border-radius: .5rem;
            border: 2px solid var(--surface2);
            background: var(--paper);
            color: var(--text);
            font-family: var(--sans);
            font-weight: 600;
            font-size: .95rem;
            cursor: pointer;
        }
        .control-group select:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(198,134,66,.15); }
        .controls .note { font-size: .9rem; color: var(--muted); font-weight: 600; text-align: center; max-width: 520px; }
        .input-row { display: flex; gap: .75rem; align-items: center; justify-content: center; flex-wrap: wrap; }
        button {
            font-family: var(--sans);
            font-weight: 700;
            font-size: .9rem;
            padding: .55rem 1.3rem;
            border: none;
            border-radius: .65rem;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform .1s, box-shadow .2s, background .2s;
        }
        button:active { transform: scale(.97); }
        button:focus-visible, a:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent2); outline-offset: 2px; }
        button:disabled { opacity: .4; cursor: not-allowed; }
        .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
        .btn-primary:hover { box-shadow: 0 4px 20px rgba(139,94,60,.3); }
        .btn-secondary { background: var(--surface2); color: var(--accent); }
        .btn-secondary:hover { background: #e6d3b8; }
        .btn-generate { background: linear-gradient(135deg, var(--green), #7db85e); color: #fff; }
        .btn-generate:hover { box-shadow: 0 4px 20px rgba(106,159,77,.3); }

        /* ── Problem display (lesson question) ─────── */
        .problem-display {
            font-size: 1.35rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1.5rem;
            background: var(--surface);
            border: 2px solid var(--surface2);
            border-radius: 1rem;
            padding: .75rem 1.5rem;
            display: inline-block;
            max-width: 100%;
        }
        .problem-display .label { color: var(--muted); font-size: 1rem; margin-right: .35rem; }
        .problem-display .target { color: var(--accent); font-weight: 800; }

        /* ── Step area ──────────────────────────────── */
        .step-area { max-width: 900px; width: 100%; }
        .step-nav { display: flex; justify-content: center; gap: .75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
        .step-nav button { min-width: 0; flex: 1 1 auto; max-width: 140px; }
        .step-counter { font-size: .85rem; color: var(--muted); text-align: center; margin-bottom: .75rem; font-weight: 600; }
        .step-card {
            background: var(--surface);
            border: 2px solid var(--surface2);
            border-radius: 1.25rem;
            padding: clamp(1rem, 3vw, 2rem);
            margin-bottom: 1rem;
            animation-duration: .4s;
            box-shadow: 0 2px 16px rgba(139,94,60,.06);
        }
        .step-card h3 { font-size: 1.1rem; color: var(--accent); margin-bottom: .75rem; text-wrap: balance; }
        .narrative { color: var(--text); font-size: 1rem; line-height: 1.65; margin-bottom: 1rem; max-width: 68ch; }
        .narrative p + p, .narrative p + ul, .narrative ul + p, .narrative p + ol, .narrative ol + p { margin-top: .55rem; }
        .narrative ul, .narrative ol { padding-left: 1.4rem; }
        .narrative li { margin: .15rem 0; }
        .narrative strong { color: var(--orange); }
        .hl-green { color: var(--green); font-weight: 800; }
        .hl-red { color: var(--red); font-weight: 800; }
        .hl-blue { color: var(--blue); font-weight: 800; }
        .hl-accent { color: var(--accent); font-weight: 800; }
        .hl-purple { color: var(--purple); font-weight: 800; }
        .cz { color: var(--muted); font-style: italic; font-weight: 600; }
        .formula {
            display: inline-block;
            font-family: var(--mono);
            font-size: .92em;
            background: var(--surface2);
            padding: .15rem .55rem;
            border-radius: .4rem;
            margin: 0 .15rem;
        }
        /* "!" = důležitá informace, like in the notebook */
        .must {
            position: relative;
            background: rgba(212,91,91,.07);
            border-left: 4px solid var(--red);
            border-radius: 0 .5rem .5rem 0;
            padding: .4rem .6rem .4rem 2rem;
        }
        .must::before {
            content: '!';
            position: absolute;
            left: .55rem;
            top: .35rem;
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--red);
            font-family: var(--sans);
        }

        /* ── Visual box (like geo-svg-wrap) ────────── */
        .viz {
            background: var(--paper);
            border: 2px solid var(--surface2);
            border-radius: .75rem;
            padding: .85rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .viz + .viz { margin-top: .75rem; }
        .viz svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
        .viz-cap { text-align: center; font-size: .82rem; color: var(--muted); font-weight: 700; margin-top: .5rem; }
        .svg-label { font-family: var(--sans); font-weight: 800; }
        .svg-small { font-family: var(--sans); font-weight: 700; }

        /* three-column cards (sources, theories) */
        .cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
        .col-card {
            border: 2px solid var(--surface2);
            border-radius: .75rem;
            padding: .75rem .6rem;
            text-align: center;
            transition: opacity .3s, transform .3s, border-color .3s;
            min-width: 0;
        }
        .col-card .ico { font-size: 2rem; line-height: 1.2; }
        .col-card h4 { color: var(--c); font-size: 1rem; margin: .2rem 0 .45rem; }
        .col-card .detail { display: flex; flex-direction: column; gap: .45rem; }
        .col-card .what { font-size: .82rem; color: var(--text); }
        .col-card .place { font-weight: 800; font-size: .85rem; color: var(--c); }
        .col-card.on { border-color: var(--c); box-shadow: 0 0 0 3px rgba(198,134,66,.12); transform: translateY(-2px); }
        .col-card.dim { opacity: .35; }
        .chips { display: flex; flex-wrap: wrap; gap: .3rem; justify-content: center; }
        .chip {
            background: var(--surface2);
            color: var(--text);
            border-radius: 999px;
            padding: .15rem .6rem;
            font-size: .8rem;
            font-weight: 700;
            white-space: nowrap;
        }

        /* places (library, archive, museum, gallery) */
        .places { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6rem; }
        .place-card {
            position: relative;
            border: 2px solid var(--surface2);
            border-radius: .75rem;
            padding: .7rem .5rem;
            text-align: center;
            transition: opacity .3s, border-color .3s;
            min-width: 0;
        }
        .place-card .ico { font-size: 2.1rem; }
        .place-card h4 { color: var(--accent); font-size: .95rem; margin: .15rem 0 .3rem; }
        .place-card .what { font-size: .8rem; }
        .place-card.on { border-color: var(--accent2); background: rgba(198,134,66,.07); }
        .place-card.dim { opacity: .35; }
        .place-card .here {
            position: absolute; top: -.7rem; right: -.4rem;
            background: var(--accent2); color: #fff; border-radius: 999px;
            font-size: .72rem; font-weight: 800; padding: .1rem .45rem;
        }

        /* chains (cause → event → consequence) */
        .chain { display: flex; align-items: stretch; justify-content: center; gap: .4rem; }
        .chain .box {
            flex: 1 1 0;
            border: 2px solid var(--c);
            border-radius: .75rem;
            padding: .6rem .5rem;
            text-align: center;
            min-width: 0;
        }
        .chain .box .tag { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 800; color: var(--c); }
        .chain .box .ico { font-size: 1.8rem; }
        .chain .box .txt { font-size: .85rem; font-weight: 700; }
        .chain .arrow { align-self: center; font-size: 1.4rem; color: var(--muted); font-weight: 800; }

        /* experts / tricky rows */
        .rows { display: flex; flex-direction: column; gap: .45rem; }
        .row-item {
            display: grid;
            grid-template-columns: 2.2rem 1fr auto;
            align-items: center;
            gap: .5rem;
            border: 2px solid var(--surface2);
            border-radius: .6rem;
            padding: .4rem .6rem;
        }
        .row-item .ico { font-size: 1.5rem; text-align: center; }
        .row-item .name { font-weight: 700; min-width: 0; }
        .row-item .name small { display: block; font-weight: 600; color: var(--muted); }
        .badge-type { font-size: .78rem; font-weight: 800; color: #fff; background: var(--c); border-radius: 999px; padding: .15rem .6rem; white-space: nowrap; }

        /* timeline of periods */
        .timeline { position: relative; padding: 1.7rem 0 3.1rem; }
        .tl-bar { display: flex; border-radius: .6rem; overflow: hidden; min-height: 4.2rem; }
        .tl-seg {
            background: var(--c);
            color: #fff;
            padding: .45rem .35rem;
            text-align: center;
            display: flex; flex-direction: column; justify-content: center;
            transition: opacity .3s, filter .3s;
            min-width: 0;
        }
        .tl-seg b { font-size: .95rem; }
        .tl-seg span { font-size: .72rem; font-weight: 700; opacity: .95; }
        .tl-seg.dim { opacity: .28; filter: grayscale(.4); }
        .tl-mark { position: absolute; transform: translateX(-50%); font-size: .72rem; font-weight: 800; color: var(--text); white-space: nowrap; text-align: center; }
        .tl-mark.top { top: 0; }
        .tl-mark.bottom { bottom: 1.55rem; }
        .tl-mark::after { content: ''; display: block; width: 2px; height: .4rem; background: var(--muted); margin: 0 auto; }
        .tl-mark.bottom::after { display: none; }
        .tl-mark.bottom::before { content: ''; display: block; width: 2px; height: .4rem; background: var(--muted); margin: 0 auto; }
        .tl-grade {
            position: absolute; bottom: 0; left: 0;
            border-top: 3px solid var(--accent);
            color: var(--accent); font-size: .78rem; font-weight: 800; text-align: center; padding-top: .1rem;
        }
        .tl-note { font-size: .75rem; color: var(--muted); text-align: right; font-weight: 600; }

        /* creation days */
        .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: .35rem; }
        .day { border: 2px solid var(--surface2); border-radius: .6rem; padding: .4rem .2rem; text-align: center; min-width: 0; }
        .day .n { font-size: .72rem; font-weight: 800; color: var(--muted); }
        .day .ico { font-size: 1.35rem; }
        .day .txt { font-size: .72rem; font-weight: 700; line-height: 1.2; }
        .day.on { border-color: var(--accent2); background: rgba(198,134,66,.08); }

        /* natural selection panels */
        .panels { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; align-items: flex-start; }
        .panel { flex: 1 1 140px; max-width: 200px; text-align: center; }
        .panel .cap { font-size: .8rem; font-weight: 700; margin-top: .3rem; }
        .panels .arrow { align-self: center; font-size: 1.3rem; color: var(--muted); font-weight: 800; }

        /* puzzle */
        .puzzle-wrap { display: flex; align-items: center; justify-content: center; gap: .8rem; flex-wrap: wrap; }
        .puzzle { display: grid; grid-template-columns: repeat(4, 2.6rem); gap: .25rem; }
        .puzzle .pc {
            width: 2.6rem; height: 2.6rem; border-radius: .4rem;
            background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 1.35rem;
        }
        .puzzle .pc.gap { background: transparent; border: 2px dashed var(--muted); color: var(--muted); font-weight: 800; font-size: 1rem; }
        .puzzle .pc.new { background: rgba(106,159,77,.25); outline: 2px solid var(--green); }
        .pile { position: relative; width: 9rem; height: 7rem; }
        .pile .pc { position: absolute; }
        .puzzle-arrow { font-size: 1.6rem; color: var(--muted); font-weight: 800; }

        /* video links */
        .videos { display: flex; flex-direction: column; gap: .45rem; margin-top: .75rem; }
        .video-link {
            display: flex; align-items: center; gap: .6rem;
            border: 2px solid var(--surface2); border-radius: .6rem; padding: .5rem .7rem;
            color: var(--text); text-decoration: none; background: var(--paper);
        }
        .video-link:hover { border-color: var(--red); }
        .video-link .play { background: var(--red); color: #fff; border-radius: .4rem; padding: .2rem .5rem; font-weight: 800; font-size: .8rem; white-space: nowrap; }
        .video-link .vt { font-weight: 700; font-size: .88rem; min-width: 0; }
        .video-link .vt small { display: block; color: var(--muted); font-weight: 600; }

        /* ── Quiz ───────────────────────────────────── */
        .q-text { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; line-height: 1.45; }
        .opts { display: grid; gap: .5rem; }
        .opt {
            text-align: left;
            background: var(--paper);
            color: var(--text);
            border: 2px solid var(--surface2);
            padding: .75rem 1rem;
            font-size: .95rem;
            min-height: 48px;
        }
        .opt:hover:not(:disabled) { border-color: var(--accent2); }
        .opt:disabled { opacity: 1; cursor: default; }
        .opt.correct { border-color: var(--green); background: rgba(106,159,77,.12); }
        .opt.wrong { border-color: var(--red); background: rgba(212,91,91,.1); }
        .opt.faded { opacity: .5; }
        .explain {
            margin-top: 1rem;
            border-radius: .75rem;
            padding: .75rem 1rem;
            font-size: .95rem;
            line-height: 1.55;
            background: var(--surface2);
        }
        .explain.ok { background: rgba(106,159,77,.13); }
        .explain.bad { background: rgba(212,91,91,.1); }
        .explain .verdict { font-weight: 800; display: block; margin-bottom: .2rem; }

        /* ── Test ───────────────────────────────────── */
        .q-num {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 2rem; height: 2rem; border-radius: 999px; padding: 0 .4rem;
            background: var(--accent); color: #fff; font-weight: 800; margin-right: .4rem; font-size: .95rem;
        }
        .answer-box {
            width: 100%;
            min-height: 6.5rem;
            padding: .75rem;
            border-radius: .65rem;
            border: 2px solid var(--surface2);
            background: var(--paper);
            color: var(--text);
            font-family: var(--sans);
            font-size: 16px;
            line-height: 1.5;
            resize: vertical;
            margin-bottom: .75rem;
        }
        .answer-box:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(198,134,66,.15); }
        .test-btns { display: flex; gap: .5rem; flex-wrap: wrap; }
        .feedback { margin-top: 1rem; display: flex; flex-direction: column; gap: .75rem; }
        .checklist { list-style: none; display: flex; flex-direction: column; gap: .3rem; }
        .checklist li { display: grid; grid-template-columns: 1.6rem 1fr; gap: .3rem; font-weight: 700; font-size: .95rem; }
        .checklist li .mk { font-weight: 800; }
        .checklist li.ok .mk { color: var(--green); }
        .checklist li.no .mk { color: var(--red); }
        .checklist li.no { color: var(--muted); }
        .checklist li small { display: block; font-weight: 600; color: var(--muted); }
        .hint { background: rgba(232,148,58,.12); border-radius: .6rem; padding: .5rem .75rem; font-weight: 700; font-size: .9rem; }
        .model { background: rgba(106,159,77,.1); border: 2px solid rgba(106,159,77,.4); border-radius: .75rem; padding: .7rem .9rem; line-height: 1.55; }
        .model .ttl { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 800; color: var(--green); display: block; margin-bottom: .2rem; }
        .pts { font-family: var(--mono); font-weight: 700; color: var(--accent); }
        .auto-note { font-size: .78rem; color: var(--muted); font-weight: 600; }

        /* ── Result card ───────────────────────────── */
        .result-card {
            background: linear-gradient(135deg, rgba(126,200,217,.12), rgba(198,134,66,.08));
            border: 2px solid var(--green);
            border-radius: 1.25rem;
            padding: 1.5rem 2rem;
            text-align: center;
            margin-top: .5rem;
            box-shadow: 0 2px 16px rgba(106,159,77,.1);
        }
        .result-card .big { font-size: 1.45rem; font-weight: 800; color: var(--green); text-wrap: balance; }
        .result-card .sub { font-size: 1rem; color: var(--muted); margin-bottom: .5rem; }
        .sum { text-align: left; margin-top: 1rem; display: flex; flex-direction: column; gap: .45rem; }
        .sum-row {
            display: grid; grid-template-columns: 2.2rem 1fr; gap: .5rem; align-items: start;

function vizCycle() {
    const cs = lang === 'cs';
    const cx = 150, cy = 150, r = 95;
    let s = `<svg viewBox="0 0 300 300" width="300" height="300" xmlns="http://www.w3.org/2000/svg" role="img">`;
    s += `<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:none;stroke:var(--green);stroke-width:4"/>`;
    [45, 135, 225, 315].forEach(a => {
        const th = a * Math.PI / 180;
        const px = cx + r * Math.sin(th), py = cy - r * Math.cos(th);
        const tx = Math.cos(th), ty = Math.sin(th);      // clockwise tangent
        const nx = -ty, ny = tx;                          // normal
        const tip = [px + tx * 9, py + ty * 9];
        const b1 = [px - tx * 6 + nx * 7, py - ty * 6 + ny * 7];
        const b2 = [px - tx * 6 - nx * 7, py - ty * 6 - ny * 7];
        s += `<polygon points="${tip.join(',')} ${b1.join(',')} ${b2.join(',')}" style="fill:var(--green)"/>`;
    });

    seasons.forEach(([e, name], i) => {
        const th = i * 90 * Math.PI / 180;

    return `<div class="viz">${s}</div>`;
}

        s += `<ellipse cx="${x}" cy="${y}" rx="9" ry="6.5" style="fill:${fill}"/><circle cx="${x + 9}" cy="${y}" r="3.2" style="fill:${fill}"/>`;
        if (bird && c === 'b') s += `<path d="M${x - 8} ${y - 8} L${x + 8} ${y + 8} M${x + 8} ${y - 8} L${x - 8} ${y + 8}" style="stroke:#d45b5b;stroke-width:3;stroke-linecap:round"/>`;
    });
    if (bird) s += `<text x="118" y="28" text-anchor="middle" style="font-size:24px">🐦</text>`;
    return s + '</svg>';
}
function vizSelection() {

    for (const ch of s) {
        const nc = ch.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
        for (let j = 0; j < nc.length; j++) { n += nc[j]; map.push(i); }
        i += ch.length;
    }
    return { n, map };
}
// All matches of a pattern that starts at the beginning of a word → original words.
function findWords(orig, nm, pattern) {
    const re = new RegExp('(^|[^a-z0-9])(' + pattern + ')', 'g');
    const words = [];
    let m;
    while ((m = re.exec(nm.n)) !== null) {
        const start = nm.map[m.index + m[1].length];
        let a = start, b = start;
        while (a > 0 && /[\p{L}\p{N}]/u.test(orig[a - 1])) a--;
        while (b < orig.length && /[\p{L}\p{N}]/u.test(orig[b])) b++;
        words.push(orig.slice(a, b));
        if (m[0].length === 0) re.lastIndex++;
    }
    return words;
}

function evaluate(item, text) {
    const nm = normMap(text);
    const rows = [], hints = [];
    let score;
    if (item.type === 'list') {
        const need = 4;
        const found = [];
        ITEM_RE[item.cat].forEach(p => { const w = findWords(text, nm, p); if (w.length) found.push(w[0]); });
        const uniq = [...new Set(found.map(w => w.toLowerCase()))];
        const n = Math.min(uniq.length, need);
        rows.push({ ok: uniq.length >= need, label: t('foundSources')(n, need), small: uniq.join(', ') });
        let placesOk = 0;
        item.places.forEach(pk => {
            const ok = findWords(text, nm, PLACE_RE[pk].re).length > 0;
            if (ok) placesOk++;
            rows.push({ ok, label: `${t('whereKept')} ${L(PLACE_RE[pk].label)}` });
        });
        // Sources of a different kind, e.g. "Bible" in the material question
        ['w', 'm', 'p'].filter(k => k !== item.cat).forEach(k => {
            ITEM_RE[k].forEach(p => findWords(text, nm, p).forEach(w => {
                if (!uniq.includes(w.toLowerCase())) hints.push(t('wrongCat')(w, t('catName')[k]));
            }));
        });
        score = (n + placesOk) / (need + item.places.length);
    } else {
        let ok = 0;
        item.concepts.forEach(c => {
            const w = findWords(text, nm, c.re);
            if (w.length) ok++;
            rows.push({ ok: w.length > 0, label: L(c.label), small: [...new Set(w)].slice(0, 3).join(', ') });
        });
        (item.wrong || []).forEach(wr => {
            const conceptHit = wr.unless !== undefined && findWords(text, nm, item.concepts[wr.unless].re).length;
            if (!conceptHit && findWords(text, nm, wr.re).length) hints.push(L(wr.hint));
        });
        score = ok / item.concepts.length;
    }
    return { score, rows, hints: [...new Set(hints)].slice(0, 4) };
}

// ═══════════════════════════════════════════════════════════════
// ENGINE – tabs, lesson player, quiz runner, test runner
// ═══════════════════════════════════════════════════════════════
Object.assign(UI.cs, {
    fbGreat: 'Výborně! Všechno důležité tam je 🎉🦫',
    fbOk: 'Dobrý základ! Podívej se, co ještě chybí 🌿',
    fbLow: 'Podívej se na vzorovou odpověď a zkus to napsat znovu 💧',
    fbRevealed: 'Přečti si vzor a zkus ho napsat vlastními slovy ✍️',
    openLesson: 'Otevřít lekci',
});
Object.assign(UI.en, {
    fbGreat: 'Excellent! Everything important is there 🎉🦫',
    fbOk: 'Good start! Have a look at what is still missing 🌿',
    fbLow: 'Look at the model answer and try writing it again 💧',
    fbRevealed: 'Read the model and try writing it in your own words ✍️',
    openLesson: 'Open lesson',
});

const TABS = [
    { key: 'src', icon: '📜', name: { cs: 'Prameny', en: 'Sources' }, lessons: SRC_LESSONS },
    { key: 'time', icon: '⏳', name: { cs: 'Dějepis a čas', en: 'History & time' }, lessons: TIME_LESSONS },
    { key: 'orig', icon: '🧬', name: { cs: 'Vznik člověka', en: 'Human origins' }, lessons: ORIG_LESSONS },
    { key: 'test', icon: '📝', name: { cs: 'Test', en: 'Test' }, test: true },
];
const TAB = Object.fromEntries(TABS.map(x => [x.key, x]));
BANK.forEach(q => { q.gen = /^(Jaký pramen je|Kde bychom)/.test(q.q.cs); });
const S = {};
let activeTab = 'src';
try { const s = localStorage.getItem('capyHistoryTab'); if (TAB[s]) activeTab = s; } catch (e) {}
const $ = id => document.getElementById(id);

function buildUI() {
    TABS.forEach(tb => {
        const k = tb.key;
        const b = document.createElement('button');
        b.className = 'tab-btn'; b.id = 'tab_' + k; b.type = 'button'; b.setAttribute('role', 'tab');
        b.addEventListener('click', () => switchTab(k));
        $('tabs').appendChild(b);

        const p = document.createElement('div');
        p.className = 'tab-panel'; p.id = 'P_' + k;
        p.innerHTML = `
            <div class="capy-speech" id="${k}_speech"></div>
            <div class="controls">
                ${tb.test ? `<p class="note" id="${k}_note"></p>`
                          : `<div class="control-group"><label for="${k}_lesson" id="${k}_lessonLbl"></label><select id="${k}_lesson"></select></div>`}
                <div class="input-row">
                    <button class="btn-primary" type="button" id="${k}_start"></button>
                    <button class="btn-generate" type="button" id="${k}_rand"></button>
                </div>
            </div>
            <div class="problem-display" id="${k}_display"></div>
            <div class="step-area" id="${k}_area">
                <div class="progress-bar"><div class="fill" id="${k}_fill"></div></div>
                <div class="step-counter" id="${k}_counter"></div>
                <div class="step-nav">
                    <button class="btn-secondary" type="button" id="${k}_first"></button>
                    <button class="btn-secondary" type="button" id="${k}_prev"></button>
                    <button class="btn-primary" type="button" id="${k}_next"></button>
                    <button class="btn-secondary" type="button" id="${k}_last"></button>
                </div>
                <div id="${k}_content" aria-live="polite"></div>
            </div>`;
        $('panels').appendChild(p);

        S[k] = { mode: tb.test ? 'test' : 'lesson', lesson: 0, idx: 0, quiz: null,
                 test: { ans: TEST.map(() => ''), res: TEST.map(() => null) } };

        if (!tb.test) $(k + '_lesson').addEventListener('change', e => startLesson(k, +e.target.value));
        $(k + '_start').addEventListener('click', () => tb.test ? startTest(k) : startLesson(k, +$(k + '_lesson').value));
        $(k + '_rand').addEventListener('click', () => startQuiz(k));
        ['first', 'prev', 'next', 'last'].forEach(w => $(k + '_' + w).addEventListener('click', () => go(k, w)));
        $(k + '_content').addEventListener('click', e => onAction(k, e));
        $(k + '_content').addEventListener('input', e => {
            if (e.target.matches('textarea[data-q]')) S[k].test.ans[+e.target.dataset.q] = e.target.value;
        });
    });
    $('langCs').addEventListener('click', () => setLang('cs'));
    $('langEn').addEventListener('click', () => setLang('en'));
}

function applyStatic() {
    document.documentElement.lang = lang;
    document.title = t('docTitle');
    $('appTitle').textContent = t('title');
    $('appSubtitle').textContent = t('subtitle');
    $('appLegend').innerHTML = t('legend');
    $('appFooter').textContent = t('footer');
    $('langCs').classList.toggle('active', lang === 'cs');
    $('langEn').classList.toggle('active', lang === 'en');
    TABS.forEach(tb => {
        const k = tb.key;
        $('tab_' + k).textContent = `${tb.icon} ${L(tb.name)}`;
        if (tb.test) {
            $(k + '_note').textContent = t('testNote');
            $(k + '_start').textContent = t('startTest');
            $(k + '_rand').textContent = t('quickQuiz');
        } else {
            $(k + '_lessonLbl').textContent = t('pickLesson');
            const sel = $(k + '_lesson');
            sel.innerHTML = tb.lessons.map((l, i) => `<option value="${i}">${L(l.name)}</option>`).join('');
            sel.value = S[k].lesson;
            $(k + '_start').textContent = t('start');
            $(k + '_rand').textContent = t('random');
        }
        ['first', 'prev', 'next', 'last'].forEach(w => { $(k + '_' + w).textContent = t(w); });
    });
}

function setLang(l) {
    lang = l;
    try { localStorage.setItem('capyHistoryLang', l); } catch (e) {}
    applyStatic();
    TABS.forEach(tb => render(tb.key));
}

function switchTab(k) {
    activeTab = k;
    TABS.forEach(tb => {
        $('tab_' + tb.key).classList.toggle('active', tb.key === k);
        $('tab_' + tb.key).setAttribute('aria-selected', tb.key === k ? 'true' : 'false');
        $('P_' + tb.key).classList.toggle('active', tb.key === k);
    });
    try { localStorage.setItem('capyHistoryTab', k); } catch (e) {}
}

function total(k) {
    const st = S[k];
    if (st.mode === 'lesson') return TAB[k].lessons[st.lesson].steps.length;
    if (st.mode === 'quiz') return st.quiz.qs.length;
    return TEST.length;
}

function go(k, where) {
    const st = S[k], n = total(k);
    if (where === 'first') st.idx = 0;
    else if (where === 'prev') st.idx = Math.max(0, st.idx - 1);
    else if (where === 'next') st.idx = Math.min(n, st.idx + 1);
    else st.idx = n;
    render(k);
    const area = $(k + '_area');
    if (area.getBoundingClientRect().top < 0) area.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function startLesson(k, i) {
    const st = S[k];
    st.mode = 'lesson'; st.lesson = i; st.idx = 0;
    $(k + '_lesson').value = i;
    render(k);
}

function startQuiz(k) {
    const n = TAB[k].test ? 10 : 5;
    const pool = shuffle(TAB[k].test ? BANK : BANK.filter(q => q.tab === k));
    const maxGen = Math.ceil(n * 0.4);   // keep "what kind of source is…" to a few per quiz
    const picked = [];
    let gen = 0;
    for (const q of pool) {
        if (picked.length >= n) break;
        if (q.gen) { if (gen >= maxGen) continue; gen++; }
        picked.push(q);
    }
    const st = S[k];
    st.mode = 'quiz'; st.idx = 0;
    st.quiz = { qs: picked.map(q => ({ q, order: q.fixed ? q.opts.map((_, i) => i) : shuffle(q.opts.map((_, i) => i)), pick: null })) };
    render(k);
}

function startTest(k) {
    S[k].mode = 'test'; S[k].idx = 0;
    render(k);
}

function render(k) {
    const st = S[k];
    const n = total(k), idx = st.idx, isFinal = idx >= n;
    $(k + '_fill').style.width = (isFinal ? 100 : ((idx + 1) / (n + 1)) * 100) + '%';
    $(k + '_counter').textContent = isFinal
        ? (st.mode === 'lesson' ? t('summary') : t('result'))
        : (st.mode === 'lesson' ? t('stepOf')(idx + 1, n) : t('questionOf')(idx + 1, n));
    $(k + '_first').disabled = idx <= 0;
    $(k + '_prev').disabled = idx <= 0;
    $(k + '_next').disabled = isFinal;
    $(k + '_last').disabled = isFinal;
    if (st.mode === 'lesson') renderLesson(k, isFinal);
    else if (st.mode === 'quiz') renderQuiz(k, isFinal);
    else renderTest(k, isFinal);
}

function renderLesson(k, isFinal) {
    const st = S[k], tb = TAB[k], lesson = tb.lessons[st.lesson], idx = st.idx;
    $(k + '_display').innerHTML = `<span class="label">${t('lessonLabel')}</span> <span class="target">${L(lesson.q)}</span>`;
    const c = $(k + '_content');
    if (isFinal) {
        $(k + '_speech').innerHTML = t('doneMsg');
        const hasNext = st.lesson < tb.lessons.length - 1;
        c.innerHTML = `<div class="result-card animate__animated animate__fadeInUp">
            <div style="font-size:2rem;margin-bottom:.25rem;">🦫🎉</div>
            <div class="sub">${t('spoken')} ${t('remember')}:</div>
            <div class="big">${L(lesson.sumTitle)}</div>
            ${lesson.sum()}
            <div class="reflect"><div class="ttl">${t('reflect')}</div><div class="btns">
                <button class="btn-generate" type="button" data-act="quiz">${t('reflectOk')}</button>
                <button class="btn-secondary" type="button" data-act="again">${t('reflectNo')}</button>
                ${hasNext ? `<button class="btn-primary" type="button" data-act="nextLesson">${t('nextLesson')}</button>` : ''}
            </div></div></div>`;
        return;
    }
    const step = lesson.steps[idx];
    const msgs = t('msgs');
    $(k + '_speech').innerHTML = step.speech ? L(step.speech) : msgs[idx % msgs.length];
    c.innerHTML = `<div class="step-card animate__animated animate__fadeIn">
        <h3>🦫 ${t('step')} ${idx + 1}: ${L(step.title)}</h3>
        <div class="narrative">${L(step.body)}</div>
        ${step.viz ? step.viz() : ''}
        ${step.videos ? vizVideos(step.videos) : ''}
    </div>`;
}

function renderQuiz(k, isFinal) {
    const st = S[k], qs = st.quiz.qs, idx = st.idx;
    $(k + '_display').innerHTML = `<span class="target">${t('quizDisplay')(qs.length)}</span>`;
    const c = $(k + '_content');
    if (isFinal) {
        const right = qs.filter(x => x.pick === x.q.c).length;
        const ratio = right / qs.length;
        $(k + '_speech').innerHTML = ratio >= 0.8 ? t('doneMsg') : t('quizBad');
        const wrong = qs.filter(x => x.pick !== x.q.c);
        c.innerHTML = `<div class="result-card animate__animated animate__fadeInUp">
            <div style="font-size:2rem;margin-bottom:.25rem;">${ratio >= 0.8 ? '🦫🎉' : ratio >= 0.5 ? '🦫🌿' : '🦫💧'}</div>
            <div class="sub">${t('spoken')}</div>
            <div class="big">${t('quizScore')(right, qs.length)}</div>
            ${wrong.length ? `<div class="sum"><div class="sub" style="margin:0">${t('quizMistakes')}</div>` +
                wrong.map(x => `<div class="sum-row"><div class="ico">💡</div><div><b>${L(x.q.q)}</b><br>${t('rightAnswer')} ${L(x.q.opts[x.q.c])}</div></div>`).join('') + '</div>' : ''}
            <div class="reflect"><div class="btns"><button class="btn-generate" type="button" data-act="quiz">${t('newQuiz')}</button></div></div>
        </div>`;
        return;
    }
    const item = qs[idx], q = item.q, answered = item.pick !== null, ok = item.pick === q.c;
    $(k + '_speech').innerHTML = !answered ? t('quizMsg') : (ok ? t('quizGood') : t('quizBad'));
    const opts = item.order.map(oi => {
        let cls = 'opt';
        if (answered) cls += oi === q.c ? ' correct' : (oi === item.pick ? ' wrong' : ' faded');
        return `<button class="${cls}" type="button" data-act="opt" data-o="${oi}" ${answered ? 'disabled' : ''}>${L(q.opts[oi])}</button>`;
    }).join('');
    const explain = answered
        ? `<div class="explain ${ok ? 'ok' : 'bad'}"><span class="verdict">${ok ? t('correct') : t('wrong') + ' ' + t('rightAnswer') + ' ' + L(q.opts[q.c])}</span>${L(q.ex)}</div>` : '';
    c.innerHTML = `<div class="step-card${answered ? '' : ' animate__animated animate__fadeIn'}">
        <h3>🌿 ${t('question')} ${idx + 1}</h3>
        <div class="q-text">${L(q.q)}</div>
        <div class="opts">${opts}</div>${explain}</div>`;
}

function maxPoints(it) { return it.type === 'list' ? 4 + it.places.length : it.concepts.length; }
function testScore(k, i) {
    const st = S[k].test;
    return st.res[i] === 'checked' ? evaluate(TEST[i], st.ans[i]).score : 0;
}
function czGrade(p) { return p >= 0.9 ? 1 : p >= 0.75 ? 2 : p >= 0.5 ? 3 : p >= 0.3 ? 4 : 5; }

function renderTest(k, isFinal) {
    const st = S[k].test, idx = S[k].idx;
    $(k + '_display').innerHTML = `<span class="label">${t('testDisplay')}:</span> <span class="target">${t('testDisplaySub')}</span>`;
    const c = $(k + '_content');
    if (isFinal) {
        const scores = TEST.map((_, i) => testScore(k, i));
        const sum = scores.reduce((a, b) => a + b, 0);
        const pct = sum / TEST.length;
        $(k + '_speech').innerHTML = t('testDoneMsg');
        const weak = TEST.map((it, i) => ({ it, s: scores[i] })).filter(x => x.s < 0.75);
        const rows = weak.map(({ it, s }) => {
            const [tk, li] = it.lesson;
            const ln = L(TAB[tk].lessons[li].name);
            return `<button class="btn-secondary" type="button" data-act="gotoLesson" data-tab="${tk}" data-lesson="${li}">
                <span class="q-num" style="height:1.6rem;min-width:1.6rem;font-size:.8rem">${it.num}</span>${L(it.q)}
                <br><small>→ ${TAB[tk].icon} ${L(TAB[tk].name)}: ${ln}</small></button>`;
        }).join('');
        c.innerHTML = `<div class="result-card animate__animated animate__fadeInUp">
            <div style="font-size:2rem;margin-bottom:.25rem;">${pct >= 0.75 ? '🦫🎉' : '🦫🌿'}</div>
            <div class="sub">${t('spoken')}</div>
            <div class="big">${t('testScore')}: ${fmtNum(sum)} / ${TEST.length}</div>
            <div class="grade">${czGrade(pct)}</div>
            <div class="sub">${t('grade')}</div>
            ${weak.length ? `<div class="review"><div class="sub" style="margin:0">${t('review')}</div>${rows}</div>` : ''}
            <div class="reflect"><div class="btns"><button class="btn-primary" type="button" data-act="retry">${t('retry')}</button></div></div>
        </div>`;
        return;
    }
    const it = TEST[idx], res = st.res[idx], ans = st.ans[idx];
    let fb = '';
    if (res) {
        const ev = evaluate(it, ans);
        const score = res === 'revealed' ? 0 : ev.score;
        $(k + '_speech').innerHTML = res === 'revealed' ? t('fbRevealed') : score >= 0.99 ? t('fbGreat') : score >= 0.5 ? t('fbOk') : t('fbLow');
        if (res === 'checked') {
            fb += `<div><b>${t('found')}</b><ul class="checklist">` + ev.rows.map(r =>
                `<li class="${r.ok ? 'ok' : 'no'}"><span class="mk">${r.ok ? '✓' : '○'}</span><span>${r.label}${r.small ? `<small>${esc(r.small)}</small>` : ''}</span></li>`).join('') + '</ul></div>';
            fb += ev.hints.map(h => `<div class="hint">⚠️ ${esc(h)}</div>`).join('');
            fb += `<div class="pts">${t('points')}: ${fmtNum(score * maxPoints(it))} / ${maxPoints(it)}</div>`;
        }
        fb += `<div class="model"><span class="ttl">${t('model')}</span>${L(it.model)}</div>`;
        if (res === 'checked') fb += `<div class="auto-note">${t('autoNote')}</div>`;
    } else {
        $(k + '_speech').innerHTML = t('testMsg');
    }
    c.innerHTML = `<div class="step-card${res ? '' : ' animate__animated animate__fadeIn'}">
        <h3><span class="q-num">${it.num}</span>${L(it.q)}</h3>
        <textarea class="answer-box" id="test_ans_${idx}" data-q="${idx}" aria-label="${esc(L(it.q))}" placeholder="${esc(t('placeholder'))}">${esc(ans)}</textarea>
        <div class="test-btns">
            <button class="btn-primary" type="button" data-act="check">${t('check')}</button>
            <button class="btn-secondary" type="button" data-act="reveal">${t('reveal')}</button>
        </div>
        <div class="feedback">${fb}</div>
    </div>`;
}

function onAction(k, e) {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const st = S[k];
    switch (b.dataset.act) {
        case 'opt': {
            const item = st.quiz.qs[st.idx];
            if (item.pick !== null) return;
            item.pick = +b.dataset.o;
            render(k);
            break;
        }
        case 'quiz': startQuiz(k); break;
        case 'again': startLesson(k, st.lesson); $(k + '_speech').innerHTML = t('retryMsg'); break;
        case 'nextLesson': startLesson(k, st.lesson + 1); break;
        case 'check': {
            const ans = st.test.ans[st.idx] || '';
            if (!ans.trim()) { $(k + '_speech').innerHTML = t('emptyAnswer'); return; }
            st.test.res[st.idx] = 'checked';
            render(k);
            break;
        }
        case 'reveal': st.test.res[st.idx] = 'revealed'; render(k); break;
        case 'retry':
            st.test.ans = TEST.map(() => ''); st.test.res = TEST.map(() => null); st.idx = 0; st.mode = 'test';
            render(k);
            break;
        case 'gotoLesson': {
            const tk = b.dataset.tab;
            switchTab(tk);
            startLesson(tk, +b.dataset.lesson);
            window.scrollTo({ top: 0, behavior: 'smooth' });
            break;
        }
    }
}

// ─── Initial render ─────────────────────────────────────────
buildUI();
applyStatic();
TABS.forEach(tb => render(tb.key));
switchTab(activeTab);
</script>
